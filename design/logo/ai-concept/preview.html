<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blanktick AI logo concept</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#101114; color:#e8e8ea; font-family:'Segoe UI',Arial,sans-serif; padding:40px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  p.sub { color:#9aa0a6; margin:0 0 32px; font-size:14px; }
  .row { display:flex; gap:40px; align-items:center; flex-wrap:wrap; margin-bottom:40px; }
  .card { background:#0a0a0a; border:1px solid #23252b; border-radius:20px; padding:28px; display:flex; align-items:center; justify-content:center; }
  .card.light { background:#f4f5f7; }
  .label { color:#6b7078; font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-top:10px; text-align:center; }
  .col { display:flex; flex-direction:column; align-items:center; }
  .wm-light { font-size:88px; font-weight:700; letter-spacing:-3px; }
  .wm-light .blank { color:#6b7078; } .wm-light .tick { color:#0a0a0a; }
  svg.mini { width:96px; height:96px; }
</style>
</head>
<body>
  <h1>Blanktick — AI logo concept (original, trademark-safe)</h1>
  <p class="sub">Gradient ribbon tick · violet → blue → cyan → lime · keeps your split-tick "air gap" DNA</p>

  <div class="row">
    <div class="col"><div class="card"><img src="blanktick-ai-icon.svg" width="180" height="180"></div><div class="label">App icon 180</div></div>
    <div class="col"><div class="card"><img src="blanktick-ai-icon.svg" width="96" height="96"></div><div class="label">96</div></div>
    <div class="col"><div class="card"><img src="blanktick-ai-icon.svg" width="48" height="48"></div><div class="label">48</div></div>
  </div>

  <div class="row">
    <div class="col"><div class="card"><img src="blanktick-ai-lockup-dark.svg" width="520"></div><div class="label">Lockup on dark</div></div>
  </div>

  <div class="row">
    <div class="col">
      <div class="card light">
        <svg class="mini" viewBox="0 0 250 250" style="width:88px;height:88px">
          <defs><linearGradient id="g" x1="20" y1="214" x2="226" y2="66" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7C3AED"/><stop offset="0.45" stop-color="#2563EB"/><stop offset="0.75" stop-color="#06B6D4"/><stop offset="1" stop-color="#9BCf00"/></linearGradient></defs>
          <path d="M20 150 L 86 214 L 168 126" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M190 104 L 226 66" fill="none" stroke="#8FBF00" stroke-width="30" stroke-linecap="round"/>
        </svg>
        <span class="wm-light"><span class="blank">blank</span><span class="tick">tick</span></span>
      </div>
      <div class="label">Lockup on light</div>
    </div>
  </div>
</body>
</html>
