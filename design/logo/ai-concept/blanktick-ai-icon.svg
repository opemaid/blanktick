<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Blanktick AI mark">
  <defs>
    <linearGradient id="ribbon" x1="120" y1="360" x2="400" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="0.75" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#D6FF3F"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#15161B"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft glow underlay -->
  <g filter="url(#glow)" opacity="0.55">
    <path d="M140 258 L 226 342 L 330 232" fill="none" stroke="url(#ribbon)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M356 206 L 402 158" fill="none" stroke="#D6FF3F" stroke-width="40" stroke-linecap="round"/>
  </g>

  <!-- main ribbon tick -->
  <path d="M140 258 L 226 342 L 330 232" fill="none" stroke="url(#ribbon)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- detached terminal chip (the air gap) -->
  <path d="M356 206 L 402 158" fill="none" stroke="#D6FF3F" stroke-width="46" stroke-linecap="round"/>

  <!-- gloss highlight -->
  <path d="M150 252 L 224 324" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
</svg>
