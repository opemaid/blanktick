<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #FAF9F6; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="62.5" data-width="1920" data-height="1080">
      <div id="el-s1" class="scene" data-composition-id="s1" data-composition-src="compositions/frames/s1.html" data-start="0.0" data-duration="4.5" data-track-index="0"></div>
      <div id="el-s2" class="scene" data-composition-id="s2" data-composition-src="compositions/frames/s2.html" data-start="4.5" data-duration="14.0" data-track-index="1"></div>
      <div id="el-s3" class="scene" data-composition-id="s3" data-composition-src="compositions/frames/s3.html" data-start="18.5" data-duration="10.0" data-track-index="0"></div>
      <div id="el-s4" class="scene" data-composition-id="s4" data-composition-src="compositions/frames/s4.html" data-start="28.5" data-duration="17.0" data-track-index="1"></div>
      <div id="el-s5" class="scene" data-composition-id="s5" data-composition-src="compositions/frames/s5.html" data-start="45.5" data-duration="10.0" data-track-index="0"></div>
      <div id="el-s6" class="scene" data-composition-id="s6" data-composition-src="compositions/frames/s6.html" data-start="55.5" data-duration="7.0" data-track-index="1"></div>

      <audio id="el-bgm1" src="assets/bgm/track.wav" data-start="0" data-duration="30" data-track-index="11" data-volume="0.14"></audio>
      <audio id="el-bgm2" src="assets/bgm/track.wav" data-start="30" data-duration="30.0" data-track-index="12" data-volume="0.14"></audio>
      <audio id="el-sfx1" src="assets/sfx/click-soft.mp3" data-start="4.6" data-duration="0.37" data-track-index="20" data-volume="0.3"></audio>
      <audio id="el-sfx2" src="assets/sfx/click-soft.mp3" data-start="18.6" data-duration="0.37" data-track-index="21" data-volume="0.3"></audio>
      <audio id="el-sfx3" src="assets/sfx/click-soft.mp3" data-start="28.6" data-duration="0.37" data-track-index="20" data-volume="0.3"></audio>
      <audio id="el-sfx4" src="assets/sfx/chime.mp3" data-start="56.0" data-duration="2.5" data-track-index="22" data-volume="0.3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      function cut(sel, start, dur) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, start);
        tl.to(sel, { opacity: 0, duration: 0.28, ease: "power2.in" }, start + dur - 0.28);
      }
      cut("#el-s1", 0.0, 4.5);
      cut("#el-s2", 4.5, 14.0);
      cut("#el-s3", 18.5, 10.0);
      cut("#el-s4", 28.5, 17.0);
      cut("#el-s5", 45.5, 10.0);
      cut("#el-s6", 55.5, 7.0);
      tl.to({}, { duration: 62.5 }, 0);
    </script>
  </body>
</html>
