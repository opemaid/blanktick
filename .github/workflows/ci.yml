name: CI

# Runs the core and desktop test suites, including the cross-language intel
# checks (MalwareCorpusTest and DriverCorpusTest). The BYOVD corpus is built
# from a small committed seed (tools/seeds/driver-hashes-test.txt) rather than
# fetched, so the driver positive-control runs here with no network dependency.
# The full shipping corpus still comes from tools/fetch_loldrivers.py.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build intel bundle (synthetic + BYOVD test corpus)
        # --demo gives a synthetic password/domain/malware bundle (malware.mus
        # carries EICAR for MalwareCorpusTest); --drivers builds drivers.mus
        # from the committed test seed so DriverCorpusTest's RTCore64 positive
        # control runs. Generated .mus are gitignored and rebuilt every run.
        run: |
          python tools/build_intel.py --demo \
            --drivers tools/seeds/driver-hashes-test.txt \
            --out desktop/src/main/resources/intel

      - name: Run core and desktop tests
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :desktop:test --console=plain --no-daemon
