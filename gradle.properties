# JVM heap for the Gradle daemon. Compose compilation on the 22-rule core plus
# the app module needs more than the 512 MB default.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# Mume ships no third-party SDKs, so there is no BuildConfig flag, no flavour
# and no variant that could enable one. Anything added here should be treated
# as a change to decision D-03 and reviewed as such.
